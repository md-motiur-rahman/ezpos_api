# Render Blueprint - Infrastructure as Code.
# Push this to GitHub, then in the Render Dashboard: New > Blueprint > select this repo.
#
# NOTE: the live resources were created via Render's REST API rather than by
# applying this Blueprint (the API has no "apply blueprint" endpoint, and the
# dashboard was not available at the time). This file has been reconciled to
# match what actually exists, so the two no longer disagree:
#   database    pos-postgres  dpg-daentv6q1p3s73a5ke0g-a  (frankfurt, free)
#   web service pos-api       srv-daenvfn40ujc7381dtb0    (frankfurt, free)
#                             https://pos-api-52vj.onrender.com

databases:
  - name: pos-postgres
    databaseName: pos_production
    # FREE tier. Render EXPIRES a free database 30 days after creation and it
    # has no backups - the live one expires 2026-10-06. Switch to
    # basic-256mb (paid, includes backups + point-in-time recovery) before any
    # real shop data goes in.
    #
    # Render also appends a suffix when the requested databaseName is already
    # taken, so the live database is actually named pos_production_xgtn. That
    # name is only ever read from DATABASE_URL, so nothing in the app cares.
    plan: free
    postgresMajorVersion: '16' # matches the Postgres version used in local dev/test (see docker setup)
    region: frankfurt # EU region, chosen for GDPR-friendly hosting (see Module 0 planning)

services:
  - type: web
    name: pos-api
    runtime: node
    plan: free
    region: frankfurt # MUST match the database's region - an internal DATABASE_URL does not resolve across regions
    branch: master # must match the repo's actual default branch (origin/HEAD -> origin/master)
    autoDeployTrigger: commit
    # --include=dev is load-bearing: NODE_ENV=production (set below) makes npm
    # omit devDependencies, and node-pg-migrate - which preDeployCommand needs -
    # is a devDependency. Without this the pre-deploy step below fails with
    # "node-pg-migrate: not found" the moment the plan is upgraded.
    buildCommand: npm ci --include=dev
    # preDeployCommand REQUIRES A PAID INSTANCE TYPE - it is silently
    # unavailable on `plan: free`, so it is commented out to match the live
    # service. While on free, migrations must be run by hand against the
    # database's EXTERNAL connection string (its ipAllowList blocks external
    # connections by default, so add your IP, run, then remove it):
    #   DATABASE_URL="<external-url>?sslmode=require" \
    #     npx node-pg-migrate up --migrations-dir src/db/migrations
    # Uncomment this the moment the plan moves to starter or above.
    # preDeployCommand: npm run migrate:up
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pos-postgres
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false # set manually in the Render dashboard once the dashboard's real domain is known
      # Optional. A single domain suffix (e.g. '.vercel.app') whose subdomains
      # may call this API from a browser. Vercel gives every PREVIEW deploy a
      # fresh hostname, so they can never be listed exactly above - without
      # this, every preview is blocked by CORS. Leave unset to disable.
      - key: CORS_ALLOWED_PREVIEW_SUFFIX
        sync: false
      # PORT is not set here - Render injects it automatically for web services,
      # and our app already reads it via process.env.PORT (see src/config/env.js).
      # Setting it explicitly (as the old hand-made service did, to 4000)
      # overrides Render's injected value and is a needless way to break routing.
      #
      # EVERY var below is REQUIRED by src/config/env.js's requiredVars, which
      # throws at boot if any one is missing - so a Blueprint deploy without
      # them crash-loops on startup rather than failing gracefully.
      #
      # All are `sync: false`: Render prompts for the value on first deploy and
      # stores it in the dashboard, so no secret is ever committed to this repo.
      # (There is deliberately no JWT_REFRESH_SECRET - refresh tokens are opaque
      # and stored server-side, not JWTs.)
      - key: JWT_ACCESS_SECRET # Module 1
        sync: false
      - key: RESEND_API_KEY # Module 1 - verification/notification email
        sync: false
      - key: EMAIL_FROM # Module 1
        sync: false
      - key: FRONTEND_URL # Module 1/3 - used to build billing + verification links
        sync: false
      - key: STRIPE_SECRET_KEY # Module 3
        sync: false
      - key: STRIPE_WEBHOOK_SECRET # Module 3
        sync: false
      - key: STRIPE_SHOP_PRICE_ID # Module 3
        sync: false
      - key: STRIPE_ADDON_HEALTH_SAFETY_PRICE_ID # Module 3
        sync: false
